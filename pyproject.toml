[project]
name = "tupa"
version = "2.0.0"
description = "TUPÃ: Electric field analyses for molecular simulations"
authors = [
    { name = "Marcelo D. Polêto", email = "mdpoleto@ufv.br" },
    { name = "Justin A. Lemkul", email = "jalemkul@vt.edu" },
    { name = "Michel Lacerda", email = "michel.lacerda@ufv.br" }
]
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "mdanalysis>=2.10.0",
    "numpy>=2.4.6",
    "pydantic>=2,<3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.urls]
"Original repository" = "https://github.com/mdpoleto/tupa"
"Publication" = "https://doi.org/10.1002/jcc.26873"

[project.scripts]
tupa = "tupa.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tupa"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/tupa",
    "tests/integration",
    "tests/unit",
    "tests/regression",
    "tests/fixtures",
    "tests/conftest.py",
    "pyproject.toml",
    "uv.lock",
    "LICENSE",
    "DEVELOPMENT.md",
    "docs",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests/unit", "tests/integration", "tests/regression"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]

[tool.ruff]
target-version = "py313"
line-length = 79
src = ["src"]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "tests/conftest.py",
    "tests/unit/**/*.py",
    "tests/integration/**/*.py",
    "tests/regression/**/*.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
