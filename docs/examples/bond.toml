# Template only: supply your own molecular files and selections.
schema_version = 2

[system]
topology = "system.psf"
trajectory = "trajectory.dcd"

[analysis]
mode = "BOND"

[environment]
selection = "protein"

[probe]
atom1 = "resname LIG and name C1"
atom2 = "resname LIG and name O1"

[pbc]
policy = "legacy"

[compute]
backend = "auto"
precision = "double"

[output]
directory = "results"
