name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked CPU dependencies
        run: uv sync --locked
      - name: Lint and formatting
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Test editable installation
        run: uv run --locked pytest
      - name: Build sdist and wheel
        run: uv build
      - name: Replace editable package with wheel
        run: uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
      - name: Test installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -m pytest \
            -c "$GITHUB_WORKSPACE/pyproject.toml" \
            "$GITHUB_WORKSPACE/tests/integration"
